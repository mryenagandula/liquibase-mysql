                     1. PHOTO FRAME
                     ===================================================== */
                  INSERT INTO daily_expense (
                      expense_id,
                      expense_type_id,
                      category_id,
                      created_by_id,
                      expense_title,
                      expense_description,
                      remarks,
                      amount,
                      created_at,
                      updated_at
                  )
                  SELECT
                      'EXP_SRI_YEN_20260929_00001',
                      et.id,
                      ec.id,
                      eu.id,
                      'Photo frame',
                      'Photo frame purchase',
                      'Personal home-decor purchase',
                      1000.00,
                      '2026-09-29 00:00:00',
                      '2026-09-29 00:00:00'
                  FROM expense_type et
                  JOIN expense_category ec
                      ON ec.category_type = 'PERSONAL'
                  JOIN expense_user eu
                      ON eu.suffix = 'SRI_YEN'
                  WHERE et.expense_type = 'SHOPPING'
                    AND NOT EXISTS (
                        SELECT 1
                        FROM daily_expense de
                        WHERE de.expense_id =
                              'EXP_SRI_YEN_20260929_00001'
