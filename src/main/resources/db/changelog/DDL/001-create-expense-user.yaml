databaseChangeLog:

  - changeSet:
      id: 001-create-expense-user
      author: srikanth

      changes:
        - createTable:
            tableName: expense_user

            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: created_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: suffix
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_expense_user_suffix

              - column:
                  name: created_at
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false