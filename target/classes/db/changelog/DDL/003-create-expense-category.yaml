databaseChangeLog:

  - changeSet:
      id: 003-create-expense-category
      author: srikanth

      changes:

        - createTable:
            tableName: expense_category

            columns:

              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: category_type
                  type: VARCHAR2(100)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: DATE
                  constraints:
                    nullable: false